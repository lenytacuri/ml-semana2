[project]
name = "ml-semana2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leny Tacuri", email = "lenytacuri1995@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml-semana2 = "ml_semana2:main"

[build-system]
